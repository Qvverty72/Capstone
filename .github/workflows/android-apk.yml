name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [prerelease]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'Fase 2/Evidencias Proyecto/CampusLink/frontendclink/**'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Fase 2/Evidencias Proyecto/CampusLink/frontendclink
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: https://campuslink-api-qa-mxwt.onrender.com
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.CAMPUSLINK_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CAMPUSLINK_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: Fase 2/Evidencias Proyecto/CampusLink/frontendclink/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies and check configuration
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          npm ci --include=dev
          npm run typecheck
          npm run poi:images
          npx expo prebuild --platform android --no-install
          node scripts/configure-android-release.mjs
      - name: Build standalone APK for local signing
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Verify APK identity and embedded bundle
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          sed -n '1,6p' "$RUNNER_TEMP/apk-badging.txt"
          grep -q "name='cl.campuslink.app'" "$RUNNER_TEMP/apk-badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/apk-badging.txt"; then
            echo 'Release APK must not be debuggable' >&2
            exit 1
          fi
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-contents.txt"
          grep -Fxq 'assets/index.android.bundle' "$RUNNER_TEMP/apk-contents.txt"
          mkdir -p artifacts
          cp "$apk" artifacts/CampusLink-0.1.0-android-unsigned.apk
          cd artifacts
          sha256sum CampusLink-0.1.0-android-unsigned.apk > SHA256SUMS.txt
          printf 'CampusLink 0.1.0\nPackage: cl.campuslink.app\nSource: %s\nAPI: %s\nArchitectures: arm64-v8a, armeabi-v7a\nStandalone release APK; local signing required before installation.\n' "$GITHUB_SHA" "$EXPO_PUBLIC_API_URL" > BUILD.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CampusLink-Android-APK
          path: Fase 2/Evidencias Proyecto/CampusLink/frontendclink/artifacts/
          if-no-files-found: error
          retention-days: 30
