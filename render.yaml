# Reuse matching services in the owner's workspace; inspect existing resources before syncing.
# Supabase and MongoDB remain external. All compute below is explicitly free.
services:
  - type: keyvalue
    name: campuslink-redis-qa
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: campuslink-api-qa
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/Qvverty72/Capstone
    branch: prerelease
    rootDir: Fase 2/Evidencias Proyecto/CampusLink/backendclink
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: MONGODB_DB_NAME
        value: campuslink
      - key: MONGODB_URI
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: RATE_LIMIT_REDIS_URL
        fromService:
          type: keyvalue
          name: campuslink-redis-qa
          property: connectionString
      # Supply the actual static-site origin and verified ingress hop count.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        sync: false

  - type: web
    name: campuslink-web-qa
    runtime: static
    repo: https://github.com/Qvverty72/Capstone
    branch: prerelease
    # Ambos frontends se compilan juntos; Render no expone archivos fuera de rootDir.
    rootDir: Fase 2/Evidencias Proyecto/CampusLink
    buildCommand: npm --prefix frontendclink ci && npm --prefix frontendclink run build:web
    staticPublishPath: ./frontendclink/dist
    buildFilter:
      paths:
        - Fase 2/Evidencias Proyecto/CampusLink/frontendclink/**
        - Fase 2/Evidencias Proyecto/CampusLink/product-analytics-web/**
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /analitica-producto
        destination: /analitica-producto/index.html
      - type: rewrite
        source: /analitica-producto/
        destination: /analitica-producto/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.23.4"
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
